# Complete create-time policy file. The automated demo reaches the same
# network rule incrementally so it can demonstrate deny, allow, then deny.
version: 1

network_policies:
  github_readonly:
    name: github-readonly
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
