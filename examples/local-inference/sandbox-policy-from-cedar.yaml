# Generated from policies.cedar. Verified via cedar symcc against schema.cedarschema.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /app
    - /var/log
    - /proc/self      # tighter than /proc — only the process's own subtree
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # Allow pip to install packages from PyPI inside the sandbox.
  pypi:
    name: PyPI
    endpoints:
      - host: pypi.org
        port: 443
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        access: read-only
    binaries:
      - path: /sandbox/.venv/bin/python3

  # Direct access to the NVIDIA inference API (L7 TLS intercept).
  # GET and POST are permitted; the Cedar policy encodes this as
  # access: full (the closest available preset — read-only excludes POST).
  nvidia_direct:
    name: NVIDIA API (L7 intercept)
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: full
    binaries:
      - path: /sandbox/.venv/bin/python3
